[project]
name = "cli-driver-antigravity"
version = "0.1.0"
description = "Antigravity (agy) ProviderDriver over the documented NDJSON stream protocol."
requires-python = ">=3.11"
dependencies = ["cli-provider-sdk", "cli-provider-transports"]

[project.entry-points."cli_provider.drivers"]
antigravity = "cli_driver_antigravity:AntigravityDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cli-provider-sdk = { workspace = true }
cli-provider-transports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli_driver_antigravity"]
