[project]
name = "cli-driver-devin"
version = "0.1.0"
description = "Devin CLI (devin acp) ProviderDriver over the official ACP JSON-RPC stdio protocol."
requires-python = ">=3.11"
dependencies = ["cli-provider-sdk", "cli-provider-transports"]

[project.entry-points."cli_provider.drivers"]
devin = "cli_driver_devin:DevinDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cli-provider-sdk = { workspace = true }
cli-provider-transports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli_driver_devin"]
