[project]
name = "cli-driver-hermes-api"
version = "0.1.0"
description = "Hermes-agent CLI ProviderDriver for B.AI/CommandCode official APIs over stream-json."
requires-python = ">=3.11"
dependencies = ["cli-provider-sdk", "cli-provider-transports"]

[project.entry-points."cli_provider.drivers"]
hermes-api = "cli_driver_hermes_api:HermesApiDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cli-provider-sdk = { workspace = true }
cli-provider-transports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli_driver_hermes_api"]
