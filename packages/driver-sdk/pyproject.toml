[project]
name = "cli-provider-sdk"
version = "0.1.0"
description = "Typed ProviderDriver SDK: schemas, context protocols and events."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_provider_sdk"]
