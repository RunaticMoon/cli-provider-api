[project]
name = "cli-provider-core"
version = "0.1.0"
description = "SQLite run controller, operator config and Runner registry. Never imports drivers."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "cli-provider-sdk",
    "cli-provider-runner",
    "cli-provider-transports",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cli-provider-sdk = { workspace = true }
cli-provider-runner = { workspace = true }
cli-provider-transports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli_provider_core"]
