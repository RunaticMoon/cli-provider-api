[project]
name = "cli-provider-api"
version = "0.1.0"
description = "Authenticated OpenAI-compatible HTTP API over the SQLite core and UDS Runners."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "cli-provider-core",
]

[project.scripts]
cli-provider-api = "cli_provider_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cli-provider-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cli_provider_api"]
