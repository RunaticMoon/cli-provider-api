[project]
name = "cli-provider-workspace"
version = "0.0.0"
description = "Workspace root: driver SDK, transports, mock driver, runner, core, API."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "drivers/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "drivers"]
addopts = "-q"
